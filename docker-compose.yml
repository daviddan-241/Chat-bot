version: '3.9'

services:
  tor:
    image: dperson/torproxy:latest
    container_name: nexus-tor
    restart: unless-stopped
    ports:
      - "9050:9050"
      - "9051:9051"
    environment:
      - TOR_MaxCircuitDirtiness=600

  nexus:
    build: .
    image: nexus-ai-chat:latest
    container_name: nexus
    restart: unless-stopped
    depends_on:
      - tor
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-nexus@agent.ai}
      - GIT_USER_NAME=${GIT_USER_NAME:-NEXUS Agent}
      - TOR_ENABLED=${TOR_ENABLED:-0}
      - TOR_PROXY=socks5h://tor:9050
      - MODULE_RELOAD_INTERVAL=3600
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-changeme-in-production}
    volumes:
      - nexus_uploads:/app/multi_agent_system/uploads
      - nexus_workspace:/app/multi_agent_system/workspace
      - nexus_modules:/app/multi_agent_system/modules
      - nexus_wallets:/app/multi_agent_system/nexus_wallets.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  nexus_uploads:
  nexus_workspace:
  nexus_modules:
  nexus_wallets:
