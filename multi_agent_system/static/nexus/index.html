<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D97757">
<link rel="manifest" href="/static/nexus/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23D97757'/%3E%3Ctext y='.9em' font-size='80' x='10'%3E🧠%3C/text%3E%3C/svg%3E">
<title>NEXUS — AI Operating System</title>
<style>
:root{
  --bg:#FAF9F5; --bg2:#F5F3EE; --sidebar:#F7F5F1; --card:#FFFFFF;
  --text:#1F1F1F; --text2:#666666; --muted:#888888; --border:#E8E5DF;
  --accent:#D97757; --accent-hover:#C96A4D; --accent-light:#F3E4DD;
  --success:#22C55E; --warning:#F59E0B; --error:#EF4444;
  --active-project:#FFF5F1; --workspace:#EEF8FF; --agentbg:#F7F4FF;
  --r-btn:14px; --r-card:18px; --r-panel:20px; --r-input:28px; --r-pill:999px;
  --sh-s:0 2px 8px rgba(0,0,0,.04); --sh-m:0 10px 30px rgba(0,0,0,.06); --sh-l:0 20px 60px rgba(0,0,0,.08);
  --sidebar-w:300px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1A1916; --bg2:#211F1B; --sidebar:#1E1C19; --card:#26241F;
    --text:#F2F0EA; --text2:#B8B4AC; --muted:#8E8A82; --border:#34312B;
    --accent-light:#3A2A22; --active-project:#33241E; --workspace:#1C2733; --agentbg:#272233; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;font-size:16px;} /* 16px = no iOS zoom */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

/* ── APP SHELL ── */
.app{display:flex;height:100dvh;width:100%;position:relative;}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--sidebar);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  padding-top:var(--safe-top); transition:transform .28s cubic-bezier(.22,1,.36,1);
  z-index:40;
}
.sidebar-head{padding:20px 18px 12px;display:flex;align-items:center;gap:10px;}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#E89B7E);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:var(--sh-s);}
.brand{font-size:20px;font-weight:700;letter-spacing:-.02em;}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em;}
.newchat{margin:6px 14px 10px;padding:12px 16px;border-radius:var(--r-btn);
  background:var(--accent);color:#fff;font-weight:600;font-size:15px;display:flex;
  align-items:center;justify-content:center;gap:8px;box-shadow:var(--sh-s);}
.newchat:active{background:var(--accent-hover);transform:scale(.98);}
.searchbox{margin:0 14px 8px;}
.searchbox input{width:100%;padding:10px 14px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:var(--card);color:var(--text);outline:none;}
.nav{flex:1;overflow-y:auto;padding:6px 10px 14px;}
.nav-sec{margin:10px 4px 4px;font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  font-size:15px;font-weight:500;color:var(--text);transition:background .15s;}
.nav-item .ico{width:20px;text-align:center;font-size:16px;opacity:.85;}
.nav-item .badge{margin-left:auto;background:var(--accent-light);color:var(--accent);
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);}
.nav-item:active{background:var(--bg2);}
.nav-item.active{background:var(--active-project);color:var(--accent);}
.nav-item.active .ico{opacity:1;}

/* ── MAIN ──
   KEYBOARD-STABLE LAYOUT:
   .main is a flex column. The view (scroll area) flexes, the input bar is a
   normal flow child at the bottom (NOT position:fixed). When the iOS keyboard
   opens we shrink .main's height to the visualViewport height via JS, so the
   input stays glued just above the keyboard and the message list scrolls
   INDEPENDENTLY underneath — content scroll never moves the keyboard/input. */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;
  height:100dvh;height:var(--app-h,100dvh);overflow:hidden;}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 14px;
  padding-top:var(--safe-top);border-bottom:1px solid var(--border);background:rgba(250,249,245,.85);
  backdrop-filter:saturate(180%) blur(14px);position:sticky;top:0;z-index:20;}
@media (prefers-color-scheme: dark){.topbar{background:rgba(26,25,22,.85);}}
.menu-btn{width:38px;height:38px;border-radius:10px;display:none;place-items:center;font-size:20px;}
.menu-btn:active{background:var(--bg2);}
.topbar .ttl{font-weight:600;font-size:16px;}
.topbar .spacer{flex:1;}
.pill{padding:6px 12px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--border);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:var(--sh-s);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.15);}
.dot.demo{background:var(--warning);box-shadow:0 0 0 3px rgba(245,158,11,.15);}

/* ── VIEWS ── */
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;display:none;}
.view.active{display:flex;flex-direction:column;}
.wrap{max-width:900px;margin:0 auto;width:100%;padding:18px 16px 28px;}

/* Chat */
.msgs{display:flex;flex-direction:column;gap:16px;}
.msg{max-width:850px;animation:rise .3s ease;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
/* animated thinking dots */
.thinking{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:15px;}
.thinking .dots{display:inline-flex;gap:3px;}
.thinking .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:tdot 1.2s infinite ease-in-out;}
.thinking .dots i:nth-child(2){animation-delay:.2s;}
.thinking .dots i:nth-child(3){animation-delay:.4s;}
@keyframes tdot{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
.statusline.live .lbl{color:var(--accent);}
/* Cursor/Factory-style narration + action groups */
.narr{font-size:16px;line-height:1.55;margin:10px 0;color:var(--text);white-space:pre-wrap;}
.actgroup{border:1px solid var(--border);border-radius:12px;margin:8px 0;background:var(--card);overflow:hidden;}
.actgroup>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);}
.actgroup>summary::-webkit-details-marker{display:none;}
.actgroup>summary .agc{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.actgroup>summary .chev{margin-left:auto;transition:transform .2s;}
.actgroup[open]>summary .chev{transform:rotate(90deg);}
.agbody{padding:2px 14px 10px;}
.agrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-top:1px solid var(--border);}
.agrow:first-child{border-top:none;}
.agrow .ic{width:18px;text-align:center;flex-shrink:0;opacity:.8;}
.agrow .openf{color:var(--accent);font-size:13px;text-decoration:none;flex-shrink:0;}
/* Lovable-style collapsed tool timeline */
.toolfold{border:1px solid var(--border);border-radius:14px;margin-top:8px;background:var(--card);overflow:hidden;}
.toolfold>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;}
.toolfold>summary::-webkit-details-marker{display:none;}
.toolfold>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s;}
.toolfold[open]>summary .chev{transform:rotate(90deg);}
.tl{padding:4px 14px 12px;}
.tl-row{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:13px;color:var(--text2);position:relative;}
.tl-row .ic{width:18px;text-align:center;flex-shrink:0;opacity:.8;}
.tl-row b{color:var(--text);font-weight:500;}
.tl-line{position:absolute;left:8px;top:24px;bottom:-6px;width:1px;background:var(--border);}
.shimmer{background:linear-gradient(90deg,var(--text2) 0%,var(--text) 50%,var(--text2) 100%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shim 1.6s linear infinite;}
@keyframes shim{to{background-position:-200% 0;}}
.msg.user{align-self:flex-end;background:#EDEAE4;border-radius:20px;padding:14px 20px;max-width:80%;}
@media (prefers-color-scheme: dark){.msg.user{background:#332F29;}}
.msg.ai{align-self:flex-start;}
.msg .who{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;}
.msg .body{font-size:16px;white-space:pre-wrap;word-wrap:break-word;}
.msg .body code{background:var(--bg2);padding:1px 5px;border-radius:6px;font-size:14px;}

/* Activity stream cards inside chat */
.event{border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px;margin-top:8px;
  background:var(--card);box-shadow:var(--sh-s);font-size:14px;}
.event .lbl{font-weight:600;font-size:12px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
.event.plan{background:var(--bg2);}
.event.agent{background:var(--agentbg);}
.event.tool{background:var(--workspace);}
.event .sub{color:var(--text2);font-size:13px;margin-top:4px;}
.tasklist{margin:8px 0 0;padding-left:18px;}
.tasklist li{margin:3px 0;font-size:13px;color:var(--text2);}
.empty{text-align:center;color:var(--muted);padding:60px 20px;}
.empty .big{font-size:42px;margin-bottom:8px;}
.empty h2{font-size:24px;font-weight:600;color:var(--text);margin:0 0 6px;}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;}
.suggest button{padding:10px 16px;border-radius:var(--r-pill);border:1px solid var(--border);
  background:var(--card);font-size:14px;box-shadow:var(--sh-s);}
.suggest button:active{background:var(--bg2);}

/* Agent dashboard */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.acard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:14px;box-shadow:var(--sh-s);}
.acard .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;}
.acard .dom{font-size:11px;color:var(--muted);margin-top:2px;}
.acard .task{font-size:13px;color:var(--text2);margin-top:8px;min-height:18px;}
.acard .bar{height:6px;border-radius:99px;background:var(--bg2);margin-top:8px;overflow:hidden;}
.acard .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s;}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.s-idle{background:var(--muted);} .s-online{background:var(--success);} .s-running{background:var(--success);}
.s-busy{background:var(--warning);} .s-error{background:var(--error);} .s-completed{background:var(--success);}
.domhdr{font-size:15px;font-weight:600;margin:18px 4px 8px;display:flex;align-items:center;gap:8px;}
.domhdr .cnt{font-size:12px;color:var(--muted);font-weight:500;}
.statbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:12px 16px;box-shadow:var(--sh-s);flex:1;min-width:90px;}
.stat .n{font-size:24px;font-weight:700;}
.stat .l{font-size:12px;color:var(--muted);}

/* Settings / connectors cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:16px;box-shadow:var(--sh-s);margin-bottom:12px;}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.field input{width:100%;padding:11px 14px;border-radius:var(--r-btn);border:1px solid var(--border);
  background:var(--bg2);color:var(--text);outline:none;}
.field input:focus{border-color:var(--accent);background:var(--card);}
.btn{padding:10px 18px;border-radius:var(--r-btn);background:var(--accent);color:#fff;font-weight:600;font-size:14px;}
.btn:active{background:var(--accent-hover);transform:scale(.98);}
.btn.sec{background:var(--bg2);color:var(--text);border:1px solid var(--border);}
.conn{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.conn:last-child{border-bottom:none;}
.conn .ci{width:38px;height:38px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-weight:700;}
.conn .cn{font-weight:600;font-size:15px;}
.conn .cs{font-size:12px;color:var(--muted);}
.conn .tag{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);}
.tag.on{background:rgba(34,197,94,.14);color:var(--success);}
.tag.off{background:var(--bg2);color:var(--muted);}

/* ── INPUT BAR (in-flow, keyboard-stable — NOT fixed) ── */
.inputbar{flex-shrink:0;padding:12px 14px;
  padding-bottom:calc(12px + var(--safe-bot));
  background:var(--bg);border-top:1px solid var(--border);z-index:30;}
.inputrow{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-input);padding:8px 8px 8px 14px;box-shadow:var(--sh-l);max-width:900px;margin:0 auto;}
.icobtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex-shrink:0;color:var(--text2);}
.icobtn:active{background:var(--bg2);}
.inputrow textarea{flex:1;border:none;background:transparent;resize:none;outline:none;color:var(--text);
  max-height:120px;padding:9px 4px;line-height:1.4;}
.sendbtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;
  place-items:center;font-size:18px;flex-shrink:0;box-shadow:var(--sh-s);}
.sendbtn:active{background:var(--accent-hover);}
.sendbtn:disabled{opacity:.4;}

/* ── MOBILE-FIRST BOTTOM NAV ── */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:var(--sidebar);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + var(--safe-bot));
  gap:0;
}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 4px;border-radius:10px;font-size:10px;color:var(--muted);
  font-weight:500;min-height:50px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.bn-item .bn-ico{font-size:22px;line-height:1;}
.bn-item.active{color:var(--accent);}
.bn-more{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 4px;font-size:10px;color:var(--muted);font-weight:500;min-height:50px;cursor:pointer;}

@media(max-width:640px){
  :root{--sidebar-w:82vw;}
  .bottom-nav{display:flex;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);z-index:46;
    width:var(--sidebar-w);max-width:320px;}
  .sidebar.open{transform:translateX(0);}
  .main{padding-bottom:calc(66px + var(--safe-bot));}
  .toast{bottom:calc(80px + var(--safe-bot));}
  .fab{bottom:calc(90px + var(--safe-bot));}
  .view-generic .wrap{padding-bottom:calc(80px + var(--safe-bot));}
  /* Larger tap targets */
  .nav-item{padding:13px 12px;}
  .btn{min-height:44px;}
  input,textarea,select{min-height:44px;}
}

/* ── ASK CARDS — Clarification UI ── */
.ask-overlay{
  position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.4);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.ask-overlay.show{opacity:1;pointer-events:all;}
.ask-sheet{
  width:100%;max-width:560px;background:var(--card);
  border-radius:28px 28px 0 0;padding:6px 20px calc(20px + var(--safe-bot));
  box-shadow:var(--sh-l);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);
  max-height:85dvh;overflow-y:auto;
}
.ask-overlay.show .ask-sheet{transform:translateY(0);}
.ask-grab{width:44px;height:5px;border-radius:99px;background:var(--border);margin:10px auto 18px;}
.ask-icon{font-size:40px;text-align:center;margin-bottom:10px;}
.ask-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:6px;}
.ask-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:20px;line-height:1.5;}
.ask-choices{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.ask-choice{
  padding:14px 18px;border-radius:16px;border:1.5px solid var(--border);
  background:var(--bg2);font-size:15px;font-weight:500;text-align:left;
  transition:all .15s;min-height:48px;cursor:pointer;
}
.ask-choice:active,.ask-choice:hover{border-color:var(--accent);background:var(--accent-light);color:var(--accent);}
.ask-choice.selected{border-color:var(--accent);background:var(--accent-light);color:var(--accent);}
.ask-yesno{display:flex;gap:10px;}
.ask-yesno button{flex:1;padding:14px;border-radius:16px;font-size:15px;font-weight:600;min-height:52px;}
.ask-yes{background:var(--success);color:#fff;}
.ask-no{background:var(--bg2);border:1.5px solid var(--border);}
.ask-input{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:16px;outline:none;margin-bottom:12px;}
.ask-input:focus{border-color:var(--accent);}
.ask-submit{width:100%;padding:14px;border-radius:16px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;min-height:52px;}
.ask-cancel{width:100%;padding:12px;border-radius:16px;font-size:14px;color:var(--text2);margin-top:6px;}

/* Backdrop for mobile sidebar */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none;}
.backdrop.show{display:block;}

/* ── WORKSPACE PANEL (slides up from bottom) ── */
.ws{position:fixed;left:0;right:0;bottom:0;height:78dvh;background:var(--card);
  border-radius:24px 24px 0 0;box-shadow:var(--sh-l);z-index:50;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;padding-bottom:var(--safe-bot);}
.ws.open{transform:translateY(0);}
.ws-grab{width:42px;height:5px;border-radius:99px;background:var(--border);margin:10px auto 4px;}
.ws-head{display:flex;align-items:center;gap:8px;padding:4px 16px 10px;border-bottom:1px solid var(--border);}
.ws-head .t{font-weight:600;}
.ws-tabs{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border);}
.ws-tab{padding:7px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;}
.ws-tab.active{background:var(--accent-light);color:var(--accent);}
.ws-body{flex:1;min-height:0;overflow:auto;padding:12px 16px;}
.ws-body pre{background:var(--bg2);border-radius:12px;padding:12px;font-size:13px;overflow:auto;
  font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;}
.ws-file{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;}
.ws-file:active{background:var(--bg2);}
.ws iframe{width:100%;height:100%;border:none;border-radius:12px;background:#fff;}
.term{background:#10100E;color:#D4F5C4;border-radius:12px;padding:12px;font-family:ui-monospace,monospace;
  font-size:13px;min-height:160px;white-space:pre-wrap;}
.term-in{display:flex;gap:8px;margin-top:8px;}
.term-in input{flex:1;background:#10100E;color:#D4F5C4;border:1px solid #2A2A24;border-radius:10px;padding:9px 12px;font-family:ui-monospace,monospace;}

/* dropzone */
.drop{border:2px dashed var(--border);border-radius:var(--r-card);padding:30px 20px;text-align:center;
  color:var(--text2);background:var(--bg2);}
.drop.drag{border-color:var(--accent);background:var(--accent-light);}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-bot));transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:var(--r-pill);font-size:14px;
  font-weight:500;box-shadow:var(--sh-l);opacity:0;transition:.3s;z-index:90;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* skill cards */
.skill{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-top:10px;box-shadow:var(--sh-s);}
.skill .st{font-weight:600;font-size:15px;}
.skill .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{background:var(--bg2);border-radius:var(--r-pill);padding:3px 10px;font-size:12px;color:var(--text2);}

/* fab to open workspace */
.fab{position:absolute;right:16px;bottom:calc(82px + var(--safe-bot));width:50px;height:50px;border-radius:16px;
  background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:20px;box-shadow:var(--sh-l);z-index:25;}
.fab:active{transform:scale(.94);}

/* ── CRYPTO WALLET ── */
.coin-tabs{display:flex;gap:6px;margin-bottom:16px;}
.coin-tab{padding:8px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--text2);
  border:1px solid var(--border);background:var(--card);transition:all .15s;}
.coin-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.coin-tab:active{transform:scale(.97);}
.wallet-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:16px;box-shadow:var(--sh-s);margin-bottom:12px;}
.wallet-card .addr{font-family:ui-monospace,monospace;font-size:12px;color:var(--text2);
  word-break:break-all;background:var(--bg2);padding:10px;border-radius:10px;margin:8px 0;}
.wallet-card .bal{font-size:22px;font-weight:700;color:var(--text);margin:4px 0;}
.wallet-card .bal small{font-size:13px;font-weight:500;color:var(--muted);}
.wallet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.qr-box{display:flex;justify-content:center;margin:10px 0;}
.qr-box img{border-radius:12px;border:4px solid var(--card);box-shadow:var(--sh-m);}
.key-row{display:flex;align-items:center;gap:8px;margin:4px 0;}
.key-row .kl{font-size:11px;color:var(--muted);min-width:80px;font-weight:600;}
.key-row .kv{font-family:ui-monospace,monospace;font-size:11px;color:var(--text2);
  word-break:break-all;flex:1;background:var(--bg2);padding:4px 8px;border-radius:6px;}
.key-row .copy{font-size:14px;cursor:pointer;padding:4px;border-radius:6px;}
.key-row .copy:hover{background:var(--bg2);}
.send-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.send-form h4{margin:0 0 10px;font-size:14px;font-weight:600;}
.send-form input{width:100%;padding:10px 12px;border-radius:var(--r-btn);border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:14px;margin-bottom:8px;outline:none;}
.send-form input:focus{border-color:var(--accent);}
.seed-box{background:#1A1A14;color:#7FFF7F;font-family:ui-monospace,monospace;font-size:12px;
  border-radius:10px;padding:12px;line-height:1.7;word-break:break-word;margin:8px 0;}
.wallet-empty{text-align:center;padding:50px 20px;color:var(--text2);}
.wallet-empty .big{font-size:40px;margin-bottom:8px;}
.wallet-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--r-pill);
  background:var(--accent-light);color:var(--accent);margin-left:6px;vertical-align:middle;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

@media (max-width:860px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);box-shadow:var(--sh-l);}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:grid;}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo">N</div>
      <div class="brand">NEXUS<small id="agentCount">360 agents online</small></div>
    </div>
    <button class="newchat" onclick="newChat()">＋ New Chat</button>
    <div class="searchbox"><input placeholder="Search…" id="search"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="backdrop" id="backdrop" onclick="toggleSidebar(false)"></div>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="ttl" id="viewTitle">New Chat</div>
      <div class="spacer"></div>
      <div class="pill"><span class="dot" id="llmDot"></span><span id="llmLabel">Live</span></div>
    </header>

    <!-- CHAT VIEW -->
    <section class="view active" id="view-chat">
      <div class="wrap">
        <div id="emptyState" class="empty">
          <div class="big">✦</div>
          <h2>What should we build?</h2>
          <p style="color:var(--text2)">One chat. 360 specialist agents. They plan, code, test, deploy — for real.</p>
          <div class="suggest">
            <button onclick="quick('Build a complete Flask REST API for a todo app with tests')">Build a REST API</button>
            <button onclick="quick('Clone a clean landing page in HTML/CSS')">Clone a landing page</button>
            <button onclick="quick('Run a security recon on my authorized test host')">Security recon</button>
            <button onclick="quick('Generate an image of a futuristic city')">Generate an image</button>
          </div>
        </div>
        <div class="msgs" id="msgs"></div>
      </div>
    </section>

    <!-- AGENTS VIEW -->
    <section class="view" id="view-agents"><div class="wrap" id="agentsWrap"></div></section>
    <!-- CONNECTORS VIEW -->
    <section class="view" id="view-connectors"><div class="wrap" id="connWrap"></div></section>
    <!-- SETTINGS VIEW -->
    <section class="view" id="view-settings"><div class="wrap" id="setWrap"></div></section>
    <!-- ARTIFACTS VIEW -->
    <section class="view" id="view-artifacts"><div class="wrap" id="artWrap"></div></section>
    <!-- CRYPTO WALLET VIEW -->
    <section class="view" id="view-wallet"><div class="wrap" id="walletWrap"></div></section>
    <!-- GENERIC PLACEHOLDER VIEWS -->
    <section class="view" id="view-generic"><div class="wrap"><div class="empty"><div class="big">🗂️</div><h2 id="genTitle"></h2><p style="color:var(--text2)" id="genSub"></p></div></div></section>

    <!-- FAB: open workspace -->
    <button class="fab" id="fab" onclick="openWS()" title="Workspace">⌗</button>

    <!-- INPUT (only on chat) -->
    <div class="inputbar" id="inputbar">
      <div class="inputrow">
        <button class="icobtn" title="Add / Workspace" onclick="openWS()">＋</button>
        <button class="icobtn" title="Attach file" onclick="document.getElementById('attachInput').click()">📎</button>
        <textarea id="prompt" rows="1" placeholder="Message NEXUS…"></textarea>
        <button class="icobtn" id="voiceBtn" title="Voice" onclick="toggleVoice()">🎙️</button>
        <button class="sendbtn" id="sendBtn" onclick="send()">↑</button>
      </div>
    </div>
  </main>
</div>

<!-- hidden inputs -->
<input type="file" id="attachInput" style="display:none" onchange="onAttach(this)">
<input type="file" id="skillInput" style="display:none" onchange="onSkillFile(this)"
  accept=".pdf,.txt,.md,.docx,.zip,.png,.jpg,.jpeg,.mp3,.wav,.mp4,.mov,.json,.csv">

<!-- WORKSPACE PANEL -->
<div class="ws" id="ws">
  <div class="ws-grab" onclick="closeWS()"></div>
  <div class="ws-head">
    <span class="t">Workspace</span>
    <span style="color:var(--muted);font-size:12px" id="wsProject">default</span>
    <div style="flex:1"></div>
    <button class="icobtn" onclick="closeWS()">✕</button>
  </div>
  <div class="ws-tabs" id="wsTabs"></div>
  <div class="ws-body" id="wsBody"></div>
</div>
<div class="backdrop" id="wsBackdrop" onclick="closeWS()"></div>

<!-- BOTTOM NAV (mobile) -->
<nav class="bottom-nav" id="bottomNav">
  <div class="bn-item active" onclick="go('agents')" id="bn-agents">
    <span class="bn-ico">🤖</span><span>Agents</span>
  </div>
  <div class="bn-item" onclick="go('mux')" id="bn-mux">
    <span class="bn-ico">🖥️</span><span>Terminal</span>
  </div>
  <div class="bn-item" onclick="go('models')" id="bn-models">
    <span class="bn-ico">🧠</span><span>AI</span>
  </div>
  <div class="bn-item" onclick="go('workflow')" id="bn-workflow">
    <span class="bn-ico">⚡</span><span>Scan</span>
  </div>
  <div class="bn-more" onclick="toggleSidebar(true)">
    <span class="bn-ico">☰</span><span>More</span>
  </div>
</nav>

<!-- ASK CARDS overlay -->
<div class="ask-overlay" id="askOverlay">
  <div class="ask-sheet" id="askSheet">
    <div class="ask-grab"></div>
    <div class="ask-icon" id="askIcon"></div>
    <div class="ask-title" id="askTitle"></div>
    <div class="ask-sub" id="askSub"></div>
    <div id="askBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/nexus/app.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/static/nexus/sw.js', {scope:'/'})
    .then(r=>console.log('[SW] registered', r.scope))
    .catch(e=>console.warn('[SW] registration failed', e));
}
// Offline command queue helper
window._queueOfflineCmd = (payload) => {
  navigator.serviceWorker.ready.then(sw =>
    sw.active?.postMessage({type:'QUEUE_CMD', payload})
  );
};
</script>
</body>
</html>
