services:
  - type: web
    name: nexus-ai-os
    env: python
    region: oregon
    plan: starter
    rootDir: multi_agent_system
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install bitcoinlib monero PySocks
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --keep-alive 5 --log-level info
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: /opt/render/project/src/multi_agent_system
      - key: MODULE_RELOAD_INTERVAL
        value: "3600"
      - key: TOR_ENABLED
        value: "0"
      - key: PORT
        value: "10000"
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
