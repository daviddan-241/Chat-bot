services:
  # ── Main NEXUS app ──────────────────────────────────
  - type: web
    name: nexus-ai-os
    env: python
    region: oregon
    plan: starter
    rootDir: multi_agent_system
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      pip install bitcoinlib monero PySocks psycopg2-binary redis
    startCommand: >
      gunicorn app:app
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 4
      --timeout 120
      --keep-alive 5
      --log-level info
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MODULE_RELOAD_INTERVAL
        value: "3600"
      - key: TOR_ENABLED
        value: "0"
      - key: OLLAMA_HOST
        value: "http://localhost:11434"
      - key: OLLAMA_MODEL
        value: "qwen2.5:7b"
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: redis
          property: connectionString

  # ── Redis ────────────────────────────────────────────
  - type: redis
    name: nexus-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # ── PostgreSQL ───────────────────────────────────────
  - name: nexus-postgres
    plan: free
    databaseName: nexus
    user: nexus
