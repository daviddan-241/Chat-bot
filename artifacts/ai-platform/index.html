    <style>
      /* Prevent iOS input zoom — font-size must be >= 16px on all inputs */
      input, textarea, select { font-size: 16px !important; }
      /* Prevent elastic bounce on iOS body */
      html { height: 100%; overflow: hidden; }
      body { height: 100%; overflow: hidden; position: fixed; width: 100%; }
      #root { height: 100%; overflow: hidden; }
      /* Smooth momentum scrolling for scrollable containers */
      * { -webkit-overflow-scrolling: touch; }
      /* Prevent callout on long press */
      * { -webkit-touch-callout: none; }
      /* Prevent text selection on UI elements */
      button, a { -webkit-user-select: none; user-select: none; }
    </style>
